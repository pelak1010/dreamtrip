<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christian & Abi — Dream Trip 2024–25 v8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --sand:#F5EDD6; --deep:#1A1C2E; --coral:#E8654A; --teal:#2ABFAA;
  --gold:#D4A843; --ink:#0F1019; --fog:rgba(245,237,214,0.07);
  --card:rgba(26,28,46,0.9); --glass:rgba(255,255,255,0.04);
  --border:rgba(245,237,214,0.1); --purple:#7B6EFF; --green:#52C97A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--ink);color:var(--sand);font-family:'DM Sans',sans-serif;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:58px;background:rgba(10,10,18,0.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-brand{font-family:'Playfair Display',serif;font-size:1rem;letter-spacing:.04em}
.nav-brand em{font-style:italic;color:var(--coral)}
.nav-tabs{display:flex;gap:.2rem}
.tab-btn{padding:.35rem .9rem;border-radius:20px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;background:transparent;color:rgba(245,237,214,.4);transition:all .2s;letter-spacing:.06em;text-transform:uppercase}
.tab-btn:hover{color:var(--sand);background:var(--fog)}
.tab-btn.active{background:var(--coral);color:#fff}
.nav-export{padding:.3rem .8rem;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--sand);font-size:.72rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.nav-export:hover{border-color:var(--coral);color:var(--coral)}
.view{display:none;padding-top:58px;min-height:100vh}
.view.active{display:block}

/* BANNER */
.banner{background:linear-gradient(135deg,rgba(26,28,46,.95) 0%,rgba(15,16,25,.98) 100%);border-bottom:1px solid var(--border);padding:1.2rem 2rem;display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center}
.bb-stat{display:flex;flex-direction:column;gap:.15rem}
.bb-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,237,214,.35)}
.bb-val{font-size:1.1rem;font-weight:600;font-family:'Playfair Display',serif}
.bb-sub{font-size:.65rem;color:rgba(245,237,214,.4)}
.bb-div{width:1px;height:40px;background:var(--border);flex-shrink:0}
.bb-red{color:var(--coral)}
.bb-green{color:var(--green)}
.bb-gold{color:var(--gold)}
.bb-teal{color:var(--teal)}

/* COUNTRY SECTIONS */
.country-section{margin:1.5rem 2rem}
.country-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--border)}
.country-title{display:flex;align-items:center;gap:.6rem;font-family:'Playfair Display',serif;font-size:1.2rem}
.country-flag{font-size:1.4rem}
.country-meta{display:flex;align-items:center;gap:1rem;font-size:.72rem;color:rgba(245,237,214,.4)}
.country-total{font-size:.8rem;padding:.2rem .6rem;border-radius:10px;background:var(--fog);border:1px solid var(--border);color:var(--sand)}
.add-stop-btn{padding:.3rem .8rem;border-radius:14px;border:1px dashed rgba(245,237,214,.2);background:transparent;color:rgba(245,237,214,.4);font-size:.7rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.add-stop-btn:hover{border-color:var(--teal);color:var(--teal)}

/* STOP CARD */
.stop-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:.5rem;overflow:hidden;transition:border-color .2s}
.stop-card:hover{border-color:rgba(245,237,214,.2)}
.stop-header{display:flex;align-items:center;gap:.8rem;padding:.75rem 1rem;cursor:pointer;user-select:none}
.stop-num{width:22px;height:22px;border-radius:50%;background:var(--fog);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:rgba(245,237,214,.4);flex-shrink:0}
.stop-dest{font-weight:500;font-size:.9rem;flex:1}
.stop-hotel{font-size:.72rem;color:rgba(245,237,214,.4);flex:1}
.stop-dates{font-size:.7rem;color:rgba(245,237,214,.4);white-space:nowrap}
.stop-cost{font-size:.78rem;font-weight:600;color:var(--teal);white-space:nowrap}
.stop-points-badge{font-size:.6rem;padding:.1rem .4rem;border-radius:8px;background:rgba(212,168,67,.12);border:1px solid rgba(212,168,67,.25);color:var(--gold)}
.stop-accom-type{font-size:.6rem;padding:.1rem .35rem;border-radius:6px;background:var(--fog);border:1px solid var(--border);color:rgba(245,237,214,.45)}
.stop-chevron{font-size:.7rem;color:rgba(245,237,214,.25);transition:transform .2s;flex-shrink:0}
.stop-card.open .stop-chevron{transform:rotate(180deg)}
.stop-body{display:none;padding:.75rem 1rem 1rem;border-top:1px solid var(--border);background:rgba(0,0,0,.2)}
.stop-card.open .stop-body{display:block}
.stop-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem;margin-bottom:.75rem}
.sf{display:flex;flex-direction:column;gap:.2rem}
.sf label{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(245,237,214,.35)}
.sf input,.sf select,.sf textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;color:var(--sand);font-family:'DM Sans',sans-serif;font-size:.8rem;padding:.35rem .5rem;transition:border-color .2s;width:100%}
.sf input:focus,.sf select:focus,.sf textarea:focus{outline:none;border-color:var(--teal)}
.sf textarea{resize:vertical;min-height:60px}
.sf select option{background:#1a1c2e}
.stop-breakdown{font-size:.65rem;color:rgba(245,237,214,.25);margin-top:.05rem;font-style:italic}
.stop-actions{display:flex;gap:.5rem;margin-top:.75rem}
.sa-btn{padding:.3rem .7rem;border-radius:10px;border:1px solid var(--border);background:transparent;color:rgba(245,237,214,.5);font-size:.68rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.sa-btn:hover{border-color:var(--coral);color:var(--coral)}
.sa-btn.del{border-color:rgba(232,101,74,.25)}
.sa-btn.flights{border-color:rgba(42,191,170,.25);color:var(--teal)}
.sa-btn.flights:hover{background:rgba(42,191,170,.1)}
.sa-btn.todo{border-color:rgba(123,110,255,.25);color:var(--purple)}
.sa-btn.todo:hover{background:rgba(123,110,255,.1)}

/* TRANSPORT CONNECTOR - within country */
.transport-connector{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.35rem 0;margin:.15rem 0}
.tc-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.tc-pill{display:flex;align-items:center;gap:.35rem;padding:.25rem .7rem;border-radius:20px;border:1px solid var(--border);background:rgba(26,28,46,.8);font-size:.68rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.tc-pill:hover{border-color:rgba(245,237,214,.3);background:rgba(26,28,46,.95)}
.tc-mode{font-size:.9rem}
.tc-label{color:rgba(245,237,214,.5);font-weight:500}
.tc-cost{color:var(--teal);font-weight:600}
.tc-each{color:rgba(245,237,214,.3);font-size:.6rem}
.tc-popover{position:absolute;z-index:100;background:#1a1c2e;border:1px solid var(--border);border-radius:10px;padding:.8rem;display:none;box-shadow:0 8px 32px rgba(0,0,0,.6);min-width:220px}
.tc-popover.open{display:block}
.tc-pop-row{display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem}
.tc-pop-row label{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(245,237,214,.35);width:55px;flex-shrink:0}
.tc-pop-row input,.tc-pop-row select{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;color:var(--sand);font-family:'DM Sans',sans-serif;font-size:.78rem;padding:.28rem .4rem}
.tc-pop-row input:focus,.tc-pop-row select:focus{outline:none;border-color:var(--teal)}
.tc-pop-row select option{background:#1a1c2e}
.tc-save-btn{width:100%;padding:.3rem;border-radius:6px;border:none;background:var(--teal);color:#0f1019;font-size:.72rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:.2rem}

/* INTER-COUNTRY TRANSPORT */
.inter-country-transport{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.6rem 0;margin:0 2rem .5rem}
.ict-line{flex:1;height:2px;background:linear-gradient(90deg,transparent,rgba(232,101,74,.3),transparent)}
.ict-pill{display:flex;align-items:center;gap:.5rem;padding:.4rem 1rem;border-radius:24px;border:1px solid rgba(232,101,74,.3);background:rgba(232,101,74,.07);font-size:.72rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.ict-pill:hover{border-color:rgba(232,101,74,.6);background:rgba(232,101,74,.12)}
.ict-mode{font-size:1rem}
.ict-label{color:rgba(245,237,214,.6);font-weight:500}
.ict-route{color:rgba(245,237,214,.35);font-size:.62rem}
.ict-cost{color:var(--coral);font-weight:600}
.ict-each{color:rgba(245,237,214,.3);font-size:.6rem}
.ict-popover{position:absolute;z-index:100;background:#1a1c2e;border:1px solid rgba(232,101,74,.3);border-radius:10px;padding:.8rem;display:none;box-shadow:0 8px 32px rgba(0,0,0,.6);min-width:260px}
.ict-popover.open{display:block}
.ict-pop-row{display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem}
.ict-pop-row label{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(245,237,214,.35);width:65px;flex-shrink:0}
.ict-pop-row input,.ict-pop-row select{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;color:var(--sand);font-family:'DM Sans',sans-serif;font-size:.78rem;padding:.28rem .4rem}
.ict-pop-row input:focus,.ict-pop-row select:focus{outline:none;border-color:var(--coral)}
.ict-pop-row select option{background:#1a1c2e}
.ict-save-btn{width:100%;padding:.3rem;border-radius:6px;border:none;background:var(--coral);color:#fff;font-size:.72rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:.2rem}

/* COUNTRY TOTAL BAR */
.country-total-bar{margin:.5rem 0 1.5rem;padding:.6rem 1rem;background:rgba(26,28,46,.5);border:1px solid var(--border);border-radius:10px;display:flex;flex-wrap:wrap;gap:1rem;font-size:.72rem}
.ctb-item{display:flex;flex-direction:column;gap:.1rem}
.ctb-lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(245,237,214,.3)}
.ctb-val{font-weight:600}

/* THINGS TO DO PANEL */
.todo-panel{background:rgba(123,110,255,.06);border:1px solid rgba(123,110,255,.2);border-radius:10px;padding:.8rem;margin-top:.75rem}
.todo-panel h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--purple);margin-bottom:.6rem}
.todo-item{display:flex;align-items:flex-start;gap:.6rem;padding:.45rem 0;border-bottom:1px solid rgba(123,110,255,.1)}
.todo-item:last-child{border-bottom:none}
.todo-icon{font-size:1rem;flex-shrink:0;margin-top:.05rem}
.todo-info{flex:1}
.todo-name{font-size:.78rem;font-weight:500}
.todo-desc{font-size:.68rem;color:rgba(245,237,214,.4);margin-top:.1rem}
.todo-price{font-size:.68rem;color:var(--green);white-space:nowrap}
.todo-add-btn{padding:.2rem .5rem;border-radius:8px;border:1px solid rgba(123,110,255,.3);background:transparent;color:var(--purple);font-size:.6rem;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0;transition:all .2s}
.todo-add-btn:hover{background:rgba(123,110,255,.15)}

/* BOOKING PANEL */
.booking-panel{background:rgba(0,150,80,.06);border:1px solid rgba(0,200,100,.2);border-radius:10px;padding:.8rem;margin-top:.75rem}
.booking-panel h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:#00c864;margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}
.booking-search-row{display:flex;gap:.4rem;margin-bottom:.8rem;flex-wrap:wrap}
.booking-search-row input{flex:1;min-width:90px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--sand);font-family:'DM Sans',sans-serif;font-size:.75rem;padding:.3rem .5rem}
.booking-search-row input:focus{outline:none;border-color:#00c864}
.booking-search-btn{padding:.3rem .8rem;border-radius:8px;border:none;background:#00c864;color:#0f1019;font-size:.72rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .2s}
.booking-search-btn:hover{background:#00a852}
.booking-search-btn:disabled{opacity:.5;cursor:not-allowed}
.booking-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.6rem}
.booking-card{background:rgba(0,0,0,.3);border:1px solid rgba(0,200,100,.15);border-radius:8px;padding:.7rem;transition:border-color .2s;cursor:pointer}
.booking-card:hover{border-color:rgba(0,200,100,.4)}
.bk-name{font-size:.78rem;font-weight:600;margin-bottom:.25rem;color:var(--sand)}
.bk-meta{font-size:.65rem;color:rgba(245,237,214,.45);margin-bottom:.35rem}
.bk-price{font-size:.85rem;font-weight:700;color:#00c864}
.bk-price span{font-size:.6rem;font-weight:400;color:rgba(245,237,214,.4)}
.bk-rating{display:inline-block;background:rgba(0,200,100,.15);border:1px solid rgba(0,200,100,.3);border-radius:5px;padding:.1rem .35rem;font-size:.65rem;color:#00c864;margin-left:.4rem}
.bk-actions{display:flex;gap:.4rem;margin-top:.5rem}
.bk-view-btn{flex:1;padding:.25rem .5rem;border-radius:6px;border:1px solid rgba(0,200,100,.3);background:transparent;color:#00c864;font-size:.62rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;text-align:center}
.bk-view-btn:hover{background:rgba(0,200,100,.1)}
.bk-use-btn{flex:1;padding:.25rem .5rem;border-radius:6px;border:none;background:rgba(0,200,100,.2);color:#00c864;font-size:.62rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .2s}
.bk-use-btn:hover{background:rgba(0,200,100,.35)}
.booking-loading{text-align:center;padding:1.2rem;color:rgba(245,237,214,.35);font-size:.75rem}
.booking-loading .bk-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,200,100,.2);border-top-color:#00c864;border-radius:50%;animation:bk-spin .8s linear infinite;margin-bottom:.4rem}
@keyframes bk-spin{to{transform:rotate(360deg)}}
.booking-error{text-align:center;padding:.8rem;color:rgba(232,101,74,.7);font-size:.73rem}
.bk-image{width:100%;height:90px;object-fit:cover;border-radius:5px;margin-bottom:.4rem;background:rgba(255,255,255,.05)}
.bk-noresult{text-align:center;padding:.8rem;color:rgba(245,237,214,.35);font-size:.73rem}
.sa-btn.booking{border-color:rgba(0,200,100,.3);color:#00c864}
.sa-btn.booking:hover{background:rgba(0,200,100,.1)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#1a1c2e;border:1px solid var(--border);border-radius:16px;padding:1.5rem;width:min(480px,90vw);max-height:90vh;overflow-y:auto}
.modal h3{font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:1rem;color:var(--sand)}
.modal-fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.modal-field{display:flex;flex-direction:column;gap:.2rem}
.modal-field.full{grid-column:1/-1}
.modal-field label{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(245,237,214,.35)}
.modal-field input,.modal-field select,.modal-field textarea{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:var(--sand);font-family:'DM Sans',sans-serif;font-size:.82rem;padding:.45rem .6rem}
.modal-field input:focus,.modal-field select:focus{outline:none;border-color:var(--teal)}
.modal-field select option{background:#1a1c2e}
.modal-actions{display:flex;gap:.6rem;margin-top:1rem;justify-content:flex-end}
.m-btn{padding:.4rem 1rem;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s}
.m-btn.save{background:var(--teal);color:#0f1019}
.m-btn.cancel{background:var(--fog);border:1px solid var(--border);color:var(--sand)}

/* BUDGET TAB */
.budget-wrap{padding:1.5rem 2rem}
.budget-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-top:1rem}
.budget-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem}
.bc-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(245,237,214,.4);margin-bottom:.6rem}
.bc-row{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--border);font-size:.78rem}
.bc-row:last-child{border-bottom:none;font-weight:600;color:var(--teal)}
.bc-dest{color:rgba(245,237,214,.7)}
.bc-amt{color:var(--sand)}

/* GLOBE TAB */
.globe-wrap{padding:1.5rem 2rem;display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media(max-width:768px){.globe-wrap{grid-template-columns:1fr}}
.globe-container{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.map-container{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;height:500px}
.globe-controls{display:flex;gap:.4rem;margin-top:.6rem;justify-content:center}
.gmode-btn{padding:.3rem .8rem;border-radius:12px;border:1px solid var(--border);background:transparent;color:rgba(245,237,214,.4);font-size:.7rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.gmode-btn:hover{color:var(--sand)}
.gmode-btn.active{background:var(--teal);color:#0f1019;border-color:var(--teal)}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;background:#1a1c2e;border:1px solid var(--teal);border-radius:10px;padding:.6rem 1rem;font-size:.78rem;color:var(--teal);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* TIPS TAB */
.tips-wrap{padding:1.5rem 2rem}
.tips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-top:1rem}
.tip-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem}
.tip-card h4{font-size:.78rem;font-weight:600;margin-bottom:.5rem;color:var(--teal)}
.tip-card p{font-size:.75rem;color:rgba(245,237,214,.6);line-height:1.55}
.tip-card ul{padding-left:1rem;margin-top:.4rem}
.tip-card ul li{font-size:.73rem;color:rgba(245,237,214,.55);margin-bottom:.25rem;line-height:1.45}

/* TOTAL SECTION */
.section-h2{font-family:'Playfair Display',serif;font-size:1rem;color:var(--sand);margin-bottom:.5rem}

/* HIDDEN SCROLLBAR GLOBE */
#globe-canvas-wrap{position:relative;width:100%;height:420px}
</style>
</head>
<body>
<nav>
  <div class="nav-brand">Christian &amp; <em>Abi</em> — Dream Trip 2024–25</div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchView('itin')">✈ Itinerary</button>
    <button class="tab-btn" onclick="switchView('budg')">💰 Budget</button>
    <button class="tab-btn" onclick="switchView('globe')">🌍 Globe</button>
    <button class="tab-btn" onclick="switchView('tips')">💡 Tips</button>
  </div>
  <button class="nav-export" onclick="exportHTML()">⬇ Export</button>
</nav>
<div class="toast" id="toast"></div>

<!-- ════════════ ITINERARY VIEW ════════════ -->
<div class="view active" id="view-itin">
  <div class="banner" id="banner"></div>
  <div id="itin-content"></div>
</div>

<!-- ════════════ BUDGET VIEW ════════════ -->
<div class="view" id="view-budg">
  <div class="budget-wrap">
    <h2 class="section-h2">Budget Breakdown</h2>
    <div id="budget-content"></div>
  </div>
</div>

<!-- ════════════ GLOBE VIEW ════════════ -->
<div class="view" id="view-globe">
  <div class="globe-wrap">

//  STORAGE HELPERS
// ═══════════════════════════════════════════
function loadStops() {
  try { const d = localStorage.getItem('dt_stops_v8'); if(d) return JSON.parse(d); } catch(e){}
  return DEFAULT_STOPS.map(s=>({...s}));
}
function saveStops(arr) {
  try { localStorage.setItem('dt_stops_v8', JSON.stringify(arr)); } catch(e){}
}
function loadICT() {
  try { const d = localStorage.getItem('dt_ict_v8'); if(d) return JSON.parse(d); } catch(e){}
  return {...DEFAULT_ICT};
}
function saveICT(obj) {
  try { localStorage.setItem('dt_ict_v8', JSON.stringify(obj)); } catch(e){}
}

let stops = loadStops();
let ictData = loadICT();

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
function nightsBetween(ci, co) {
  if(!ci||!co) return 0;
  const a = new Date(ci+'T00:00:00'), b = new Date(co+'T00:00:00');
  return Math.max(0, Math.round((b-a)/86400000));
}
function calcStopCost(s) {
  const n = nightsBetween(s.checkin, s.checkout);
  return (parseFloat(s.costPerNight)||0)*n + (parseFloat(s.transport)||0);
}
function calcCountryStopsCost(country) {
  return stops.filter(s=>s.country===country).reduce((a,s)=>a+calcStopCost(s),0);
}
function calcGrandTotal() {
  let total = stops.reduce((a,s)=>a+calcStopCost(s),0);
  Object.values(ictData).forEach(v=>{ total += (parseFloat(v.cost)||0)*2; });
  return total;
}
function fmtNZD(n) { return '$'+(Math.round(n)).toLocaleString(); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
const MODE_META = {
  plane: { icon:'✈', label:'Flight', color:'var(--teal)' },
  ferry: { icon:'⛴', label:'Ferry', color:'var(--purple)' },
  bus:   { icon:'🚌', label:'Bus/Van', color:'var(--gold)' },
  train: { icon:'🚂', label:'Train', color:'#88c988' },
  drive: { icon:'🚗', label:'Drive', color:'#d4a843' },
  walk:  { icon:'🚶', label:'Walk', color:'rgba(245,237,214,.4)' },
};
function modeMeta(m) { return MODE_META[m] || MODE_META['bus']; }

// ═══════════════════════════════════════════
//  VIEW SWITCHING
// ═══════════════════════════════════════════
function switchView(v) {
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  const btns = document.querySelectorAll('.tab-btn');
  ['itin','budg','globe','tips'].forEach((name,i)=>{ if(name===v) btns[i].classList.add('active'); });
  if(v==='globe') { initGlobe(); initLeafletMap(); }
  if(v==='budg') renderBudget();
  if(v==='tips') renderTips();
}

// ═══════════════════════════════════════════
//  BANNER
// ═══════════════════════════════════════════
function renderBanner() {
  const total = calcGrandTotal();
  const totalPP = total/2;
  const accorUsed = stops.reduce((a,s)=>a+(parseInt(s.points)||0),0);
  const accorLeft = INITIAL_ACCOR - accorUsed;
  const remainPP = BUDGET_PP - totalPP;
  const ictTotal = Object.values(ictData).reduce((a,v)=>a+(parseFloat(v.cost)||0)*2,0);
  document.getElementById('banner').innerHTML = `
    <div class="bb-stat"><div class="bb-label">Combined Budget</div><div class="bb-val bb-gold">${fmtNZD(BUDGET_COMBINED)}</div><div class="bb-sub">$15k each</div></div>
    <div class="bb-div"></div>
    <div class="bb-stat"><div class="bb-label">Total Spent</div><div class="bb-val bb-red">${fmtNZD(total)}</div><div class="bb-sub">${fmtNZD(totalPP)} each</div></div>
    <div class="bb-div"></div>
    <div class="bb-stat"><div class="bb-label">Remaining</div><div class="bb-val ${remainPP>0?'bb-green':'bb-red'}">${fmtNZD(remainPP*2)}</div><div class="bb-sub">${fmtNZD(remainPP)} each</div></div>
    <div class="bb-div"></div>
    <div class="bb-stat"><div class="bb-label">Transport Between Countries</div><div class="bb-val bb-teal">${fmtNZD(ictTotal)}</div><div class="bb-sub">${fmtNZD(ictTotal/2)} each</div></div>
    <div class="bb-div"></div>
    <div class="bb-stat"><div class="bb-label">Accor Points</div><div class="bb-val bb-gold">${accorLeft.toLocaleString()}</div><div class="bb-sub">${accorUsed.toLocaleString()} used of ${INITIAL_ACCOR.toLocaleString()}</div></div>
    <div class="bb-div"></div>
    <div class="bb-stat"><div class="bb-label">Airpoints</div><div class="bb-val" style="color:var(--purple)">${INITIAL_AIRPOINTS}</div><div class="bb-sub">Use for long-haul!</div></div>
  `;
}

// ═══════════════════════════════════════════
//  INTER-COUNTRY TRANSPORT CONNECTOR
// ═══════════════════════════════════════════
function buildICT(key) {
  const d = ictData[key] || { mode:'plane', icon:'✈', label:'Flight', route:'', cost:0, notes:'' };
  const mm = modeMeta(d.mode);
  const totalCost = (parseFloat(d.cost)||0)*2;
  const eachCost = parseFloat(d.cost)||0;
  const pid = 'ict-pop-'+key.replace(/[^a-zA-Z0-9]/g,'_');
  return `
    <div class="inter-country-transport" style="position:relative">
      <div class="ict-line"></div>
      <div class="ict-pill" onclick="toggleICTPop('${pid}')">
        <span class="ict-mode">${mm.icon}</span>
        <span class="ict-label">${mm.label}</span>
        <span class="ict-route">${d.route || key}</span>
        <span class="ict-cost">${totalCost>0?fmtNZD(totalCost)+' total':'no cost'}</span>
        <span class="ict-each">${eachCost>0?'('+fmtNZD(eachCost)+' each)':''}</span>
        <span style="font-size:.65rem;color:rgba(245,237,214,.25)">✎</span>
      </div>
      <div class="ict-popover" id="${pid}">
        <div class="ict-pop-row"><label>Mode</label>
          <select id="${pid}-mode" onchange="ictModeChange('${pid}','${key}')">
            <option value="plane" ${d.mode==='plane'?'selected':''}>✈ Flight</option>
            <option value="ferry" ${d.mode==='ferry'?'selected':''}>⛴ Ferry</option>
            <option value="bus" ${d.mode==='bus'?'selected':''}>🚌 Bus/Van</option>
            <option value="train" ${d.mode==='train'?'selected':''}>🚂 Train</option>
            <option value="drive" ${d.mode==='drive'?'selected':''}>🚗 Drive</option>
          </select>
        </div>
        <div class="ict-pop-row"><label>Route</label><input id="${pid}-route" value="${d.route||''}" placeholder="e.g. Bali → Cebu"></div>
        <div class="ict-pop-row"><label>Cost pp ($)</label><input type="number" id="${pid}-cost" value="${eachCost}"></div>
        <div class="ict-pop-row"><label>Notes</label><input id="${pid}-notes" value="${d.notes||''}"></div>
        <button class="ict-save-btn" onclick="saveICTPop('${pid}','${key}')">Save</button>
      </div>
      <div class="ict-line"></div>
    </div>`;
}
function toggleICTPop(pid) {
  document.querySelectorAll('.ict-popover.open').forEach(p=>{ if(p.id!==pid) p.classList.remove('open'); });
  document.getElementById(pid).classList.toggle('open');
}
function ictModeChange(pid, key) {}
function saveICTPop(pid, key) {
  const mode = document.getElementById(pid+'-mode').value;
  const route = document.getElementById(pid+'-route').value;
  const cost = parseFloat(document.getElementById(pid+'-cost').value)||0;
  const notes = document.getElementById(pid+'-notes').value;
  ictData[key] = { mode, icon: modeMeta(mode).icon, label: modeMeta(mode).label, route, cost, notes };
  saveICT(ictData);
  document.getElementById(pid).classList.remove('open');
  renderItinerary();
  renderBanner();
  showToast('✓ Transport updated');
}

// ═══════════════════════════════════════════
//  WITHIN-COUNTRY TRANSPORT CONNECTOR
// ═══════════════════════════════════════════
function buildConnector(stop) {
  if(!(parseFloat(stop.transport)>0)) return '';
  const mode = stop.transportMode || 'bus';
  const mm = modeMeta(mode);
  const total = (parseFloat(stop.transport)||0)*2;
  const each_ = parseFloat(stop.transport)||0;
  const pid = 'tc-pop-'+stop.id;
  return `
    <div class="transport-connector" style="position:relative">
      <div class="tc-line"></div>
      <div class="tc-pill" onclick="toggleTCPop('${pid}')">
        <span class="tc-mode">${mm.icon}</span>
        <span class="tc-label">${mm.label}</span>
        <span class="tc-cost">${fmtNZD(total)}</span>
        <span class="tc-each">(${fmtNZD(each_)}pp)</span>

        <div class="sf"><label>Accor Points</label><input type="number" value="${s.points||0}" onchange="updateStop('${s.id}','points',parseInt(this.value)||0)"></div>
        <div class="sf"><label>Transport cost (pp $)</label><input type="number" value="${s.transport||0}" onchange="updateStop('${s.id}','transport',parseFloat(this.value)||0)"></div>
        <div class="sf"><label>Transport Mode</label>
          <select onchange="updateStop('${s.id}','transportMode',this.value)">
            <option value="plane" ${(s.transportMode||'bus')==='plane'?'selected':''}>✈ Flight</option>
            <option value="ferry" ${(s.transportMode||'bus')==='ferry'?'selected':''}>⛴ Ferry</option>
            <option value="bus" ${(s.transportMode||'bus')==='bus'?'selected':''}>🚌 Bus/Van</option>
            <option value="train" ${(s.transportMode||'bus')==='train'?'selected':''}>🚂 Train</option>
            <option value="drive" ${(s.transportMode||'bus')==='drive'?'selected':''}>🚗 Drive</option>

//  RENDER ITINERARY
// ═══════════════════════════════════════════
const COUNTRY_ORDER = ['Indonesia','Philippines','Vietnam','Sri Lanka','Maldives','Peru','Brazil','Argentina'];
const COUNTRY_FLAGS = { Indonesia:'🇮🇩', Philippines:'🇵🇭', Vietnam:'🇻🇳', 'Sri Lanka':'🇱🇰', Maldives:'🇲🇻', Peru:'🇵🇪', Brazil:'🇧🇷', Argentina:'🇦🇷' };
// ICT keys between consecutive countries
const ICT_KEYS = [
  'Indonesia→Philippines',
  'Philippines→Vietnam',
  'Vietnam→Sri Lanka',
  'Sri Lanka→Maldives',
  'Sri Lanka→Peru',
  'Maldives→Peru',
  'Peru→Brazil',
  'Brazil→Argentina',
];

function renderItinerary() {
  renderBanner();
  const countries = [...new Set(stops.map(s=>s.country))];
  // Sort countries by predefined order
  countries.sort((a,b)=>{
    const ai = COUNTRY_ORDER.indexOf(a), bi = COUNTRY_ORDER.indexOf(b);
    return (ai===-1?99:ai) - (bi===-1?99:bi);
  });

  let html = '';
  countries.forEach((country, cIdx) => {
    const cStops = stops.filter(s=>s.country===country);
    const cTotal = cStops.reduce((a,s)=>a+calcStopCost(s),0);
    const cPoints = cStops.reduce((a,s)=>a+(parseInt(s.points)||0),0);
    html += `
    <div class="country-section">
      <div class="country-header">
        <div class="country-title">
          <span class="country-flag">${COUNTRY_FLAGS[country]||'🌍'}</span>
          <span>${country}</span>
        </div>
        <div class="country-meta">
          <span>${cStops.length} stops</span>
          ${cPoints>0?`<span style="color:var(--gold)">⭐ ${cPoints.toLocaleString()} pts</span>`:''}
          <span class="country-total">${fmtNZD(cTotal*2)} combined (${fmtNZD(cTotal)} each)</span>
          <button class="add-stop-btn" onclick="openModal('${country}')">+ Add Stop</button>
        </div>
      </div>`;

    cStops.forEach((s, si) => {
      if(si>0) html += buildConnector(s);
      html += buildStopCard(s, si);
    });

    // Country total bar
    html += `<div class="country-total-bar">
      <div class="ctb-item"><div class="ctb-lbl">Accommodation</div><div class="ctb-val bb-teal">${fmtNZD(cStops.reduce((a,s)=>a+(parseFloat(s.costPerNight)||0)*nightsBetween(s.checkin,s.checkout),0)*2)}</div></div>
      <div class="ctb-item"><div class="ctb-lbl">Internal Transport</div><div class="ctb-val bb-gold">${fmtNZD(cStops.reduce((a,s)=>a+(parseFloat(s.transport)||0),0)*2)}</div></div>
      <div class="ctb-item"><div class="ctb-lbl">Accor Points Used</div><div class="ctb-val" style="color:var(--gold)">${cPoints.toLocaleString()}</div></div>
      <div class="ctb-item"><div class="ctb-lbl">Total ${country}</div><div class="ctb-val bb-coral" style="color:var(--coral)">${fmtNZD(cTotal*2)} <span style="font-size:.65rem;opacity:.6">(${fmtNZD(cTotal)} each)</span></div></div>
    </div>`;

    html += `</div>`;

    // Inter-country transport after each country (except last)
    const nextCountry = countries[cIdx+1];
    if(nextCountry) {
      const ictKey = `${country}→${nextCountry}`;
      const altKey = Object.keys(DEFAULT_ICT).find(k=>k.startsWith(country+'→'));
      const keyToUse = ictData[ictKey] ? ictKey : (ictData[altKey] ? altKey : ictKey);
      if(ictData[keyToUse] || DEFAULT_ICT[ictKey] || DEFAULT_ICT[altKey]) {
        html += buildICT(keyToUse);
      }
    }
  });

  document.getElementById('itin-content').innerHTML = html;
}

function toggleBooking(sid) {

  const s = stops.find(s => s.id === sid);
  if (!s) return;

  const co = s.checkout || '';

  el.innerHTML = `
    <div class="booking-panel">

        <input type="text" id="bk-dest-${sid}" value="${s.dest}" placeholder="Destination">

        <input type="date" id="bk-co-${sid}" value="${co}" title="Check-out">
        <button class="booking-search-btn" id="bk-btn-${sid}" onclick="runBookingSearch('${sid}')">Search</button>
      </div>
      <div id="bk-results-${sid}"><div class="bk-noresult">Enter dates above and hit Search to find live prices</div></div>
    </div>`;
}

async function runBookingSearch(sid) {
  const s = stops.find(s => s.id === sid);
  if (!s) return;
  const dest = document.getElementById('bk-dest-'+sid).value || s.dest;
  const ci = document.getElementById('bk-ci-'+sid).value || s.checkin;
  const co = document.getElementById('bk-co-'+sid).value || s.checkout;
  const btn = document.getElementById('bk-btn-'+sid);
  const resultsEl = document.getElementById('bk-results-'+sid);

  btn.disabled = true;
  btn.textContent = 'Searching…';
  resultsEl.innerHTML = `<div class="booking-loading"><div class="bk-spinner"></div><br>Fetching live prices from Booking.com…</div>`;

  // Figure out nights for guests count
  const nights = nightsBetween(ci, co) || 2;

  try {
    const prompt = `Search Booking.com for hotels in "${dest}", check-in ${ci || 'next month'}, check-out ${co || 'a few days later'}, 2 adults, 1 room. Return the top 6 results. For each property include: name, address, star_rating, review_score, price_per_night_usd (approximate), booking_url if available, and a short description. Respond ONLY with a valid JSON array, no markdown, no preamble. Format: [{"name":"...","address":"...","stars":4,"score":8.5,"price_usd":85,"url":"...","desc":"...","image_url":"..."}]`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        mcp_servers: [{ type: 'url', url: 'https://demandapi-mcp.booking.com/v1/mcp/8132308', name: 'booking-com' }],
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();

    // Extract text from all content blocks
    let rawText = '';
    if (data.content && Array.isArray(data.content)) {
      for (const block of data.content) {
        if (block.type === 'text') rawText += block.text;
        if (block.type === 'mcp_tool_result' && block.content?.[0]?.text) rawText += block.content[0].text;
      }
    }

    // Try to parse JSON
    let hotels = [];
    try {
      const clean = rawText.replace(/```json|```/g, '').trim();
      // Find JSON array in the text
      const match = clean.match(/\[[\s\S]*\]/);
      if (match) hotels = JSON.parse(match[0]);
    } catch(e) {
      // fallback: try full parse
      try { hotels = JSON.parse(rawText.replace(/```json|```/g,'')); } catch(e2) {}
    }

    if (!hotels || hotels.length === 0) {
      resultsEl.innerHTML = `<div class="booking-error">No results found — try adjusting the destination or dates.<br><small style="opacity:.5">${rawText.slice(0,200)}</small></div>`;
      return;
    }

    // NZD conversion (rough: 1 USD ≈ 1.65 NZD)
    const USD_TO_NZD = 1.65;

    resultsEl.innerHTML = `<div class="booking-results">${hotels.map((h,i) => {
      const priceNZD = h.price_usd ? Math.round(h.price_usd * USD_TO_NZD) : null;
      const stars = h.stars ? '★'.repeat(Math.min(5,h.stars)) : '';
      const score = h.score ? `<span class="bk-rating">${h.score}/10</span>` : '';
      return `<div class="booking-card">
        ${h.image_url ? `<img class="bk-image" src="${h.image_url}" onerror="this.style.display='none'" alt="">` : ''}
        <div class="bk-name">${h.name || 'Hotel'}</div>
        <div class="bk-meta">${stars}${score} ${h.address ? '· '+h.address.slice(0,40) : ''}</div>
        ${h.desc ? `<div class="bk-meta" style="color:rgba(245,237,214,.35);margin-top:.2rem">${h.desc.slice(0,80)}…</div>` : ''}
        <div class="bk-price">${priceNZD ? '$'+priceNZD+' NZD' : 'See price'}<span> / night</span></div>
        <div class="bk-actions">
          ${h.url ? `<button class="bk-view-btn" onclick="window.open('${h.url}','_blank')">View on Booking.com</button>` : `<button class="bk-view-btn" onclick="window.open('https://www.booking.com/search.html?ss=${encodeURIComponent(dest)}&checkin=${ci}&checkout=${co}','_blank')">Search Booking.com</button>`}
          <button class="bk-use-btn" onclick="useHotelForStop('${sid}','${h.name.replace(/'/g,"\\'")}',${priceNZD||0})">Use This</button>
        </div>
      </div>`;
    }).join('')}</div>`;

  } catch(err) {
    resultsEl.innerHTML = `<div class="booking-error">Search failed: ${err.message}.<br>Try <a href="https://www.booking.com/search.html?ss=${encodeURIComponent(dest)}" target="_blank" style="color:#00c864">Booking.com directly ↗</a></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Search';
  }
}

function useHotelForStop(sid, hotelName, priceNZD) {
  const s = stops.find(s => s.id === sid);
  if (!s) return;
  s.hotel = hotelName;
  if (priceNZD > 0) s.costPerNight = priceNZD;
  saveStops(stops);
  renderItinerary();
  showToast('✓ Hotel set: ' + hotelName);
}

function renderBudget() {
  const COUNTRY_ORDER2 = ['Indonesia','Philippines','Vietnam','Sri Lanka','Maldives','Peru','Brazil','Argentina'];
  let html = '<div class="budget-grid">';
  let grandTotal = 0;

  COUNTRY_ORDER2.forEach(country=>{
    const cStops = stops.filter(s=>s.country===country);
    if(cStops.length===0) return;
    const rows = cStops.map(s=>{
      const n=nightsBetween(s.checkin,s.checkout);
      const c=calcStopCost(s)*2;
      grandTotal+=c;
      return `<div class="bc-row"><span class="bc-dest">${s.dest}${s.points>0?` <small style="color:var(--gold)">⭐${s.points.toLocaleString()}pts</small>`:''}</span><span class="bc-amt">${fmtNZD(c)}</span></div>`;
    });
    const cTotal = cStops.reduce((a,s)=>a+calcStopCost(s)*2,0);
    html+=`<div class="budget-card"><div class="bc-title">${COUNTRY_FLAGS[country]||'🌍'} ${country}</div>${rows.join('')}<div class="bc-row" style="margin-top:.3rem;border-top:1px solid var(--border);padding-top:.4rem"><span class="bc-dest">Subtotal</span><span class="bc-amt" style="color:var(--teal)">${fmtNZD(cTotal)}</span></div></div>`;
  });

  // Inter-country transport card
  let ictHtml = '';
  let ictTotal = 0;
  Object.entries(ictData).forEach(([key,v])=>{
    const c = (parseFloat(v.cost)||0)*2;
    ictTotal+=c;
    ictHtml+=`<div class="bc-row"><span class="bc-dest">${v.icon||'✈'} ${key}</span><span class="bc-amt">${fmtNZD(c)}</span></div>`;
  });
  grandTotal+=ictTotal;
  html+=`<div class="budget-card"><div class="bc-title">✈ Between Countries</div>${ictHtml}<div class="bc-row" style="margin-top:.3rem;border-top:1px solid var(--border);padding-top:.4rem"><span class="bc-dest">Subtotal</span><span class="bc-amt" style="color:var(--coral)">${fmtNZD(ictTotal)}</span></div></div>`;

  // Grand total card
  html+=`<div class="budget-card" style="border-color:var(--teal)">
    <div class="bc-title">📊 Grand Total</div>
    <div class="bc-row"><span class="bc-dest">Total Combined</span><span class="bc-amt" style="color:var(--coral);font-size:1.1rem">${fmtNZD(grandTotal)}</span></div>
    <div class="bc-row"><span class="bc-dest">Per Person</span><span class="bc-amt" style="color:var(--teal)">${fmtNZD(grandTotal/2)}</span></div>
    <div class="bc-row"><span class="bc-dest">Budget Each</span><span class="bc-amt" style="color:var(--gold)">${fmtNZD(BUDGET_PP)}</span></div>
    <div class="bc-row"><span class="bc-dest">Remaining Each</span><span class="bc-amt" style="color:${BUDGET_PP-grandTotal/2>0?'var(--green)':'var(--coral)'}">${fmtNZD(BUDGET_PP-grandTotal/2)}</span></div>
    <div class="bc-row"><span class="bc-dest">Accor Points Start</span><span class="bc-amt" style="color:var(--gold)">${INITIAL_ACCOR.toLocaleString()}</span></div>
    <div class="bc-row"><span class="bc-dest">Points Used</span><span class="bc-amt">${stops.reduce((a,s)=>a+(parseInt(s.points)||0),0).toLocaleString()}</span></div>
    <div class="bc-row"><span class="bc-dest">Points Remaining</span><span class="bc-amt" style="color:var(--gold)">${(INITIAL_ACCOR-stops.reduce((a,s)=>a+(parseInt(s.points)||0),0)).toLocaleString()}</span></div>
  </div>`;

  html+='</div>';
  document.getElementById('budget-content').innerHTML = html;
}

let globeInited = false, globeAnimFrame;
const ROUTE_COORDS = [
  [-8.4095,115.1889,'Bali'],[-8.6524,116.3240,'Lombok'],[-8.4892,119.8880,'Labuan Bajo'],
  [10.3157,123.8854,'Cebu'],[9.8500,124.1430,'Bohol'],[9.1856,123.5100,'Siquijor'],
  [9.8600,126.0478,'Siargao'],[11.9674,121.9248,'Boracay'],[11.1750,119.4105,'El Nido'],
  [21.0278,105.8342,'Hanoi'],[20.9099,107.1839,'Ha Long Bay'],[16.4637,107.5909,'Hue'],
  [15.8801,108.3380,'Hoi An'],[16.0544,108.2022,'Da Nang'],[10.8231,106.6297,'HCMC'],
  [10.2898,103.9840,'Phu Quoc'],[7.8731,80.7718,'Sri Lanka'],[3.2028,73.2207,'Maldives'],
  [-12.0464,-77.0428,'Lima'],[-13.5319,-71.9675,'Cusco'],[-13.1631,-72.5450,'Machu Picchu'],
  [-15.8402,-70.0219,'Puno'],[-3.7172,-38.5433,'Fortaleza'],[-9.6658,-35.7350,'Maceió'],
  [-8.0522,-34.9286,'Recife'],[-12.9714,-38.5014,'Salvador'],[-22.9068,-43.1729,'Rio'],
  [-27.5969,-48.5495,'Florianópolis'],[-34.6037,-58.3816,'Buenos Aires'],
  [-41.1335,-71.3103,'Bariloche'],[-50.3377,-72.2648,'El Calafate'],
  [-49.3310,-72.8860,'El Chaltén'],[-32.8908,-68.8272,'Mendoza'],
];
function latLngToVec(lat,lng,r){
  const phi=(90-lat)*Math.PI/180, th=(lng+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(th));
}
function initGlobe(){
  if(globeInited) return;
  globeInited=true;
  const wrap=document.getElementById('globe-canvas-wrap');
  const canvas=document.getElementById('globe-canvas');
  const W=wrap.clientWidth, H=wrap.clientHeight||420;
  canvas.width=W; canvas.height=H;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setSize(W,H);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(50,W/H,0.1,100);
  camera.position.z=2.8;
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dl=new THREE.DirectionalLight(0xffffff,0.8);
  dl.position.set(5,3,5); scene.add(dl);
  // Globe sphere
  const geo=new THREE.SphereGeometry(1,64,64);
  const texLoader=new THREE.TextureLoader();
  texLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg',
    tex=>{ const mat=new THREE.MeshLambertMaterial({map:tex}); scene.add(new THREE.Mesh(geo,mat)); },
    undefined, ()=>{ const mat=new THREE.MeshLambertMaterial({color:0x1a3a5c}); scene.add(new THREE.Mesh(geo,mat)); }
  );
  // Route line
  const pts=ROUTE_COORDS.map(([lat,lng])=>latLngToVec(lat,lng,1.01));
  const lineGeo=new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xE8654A,linewidth:2})));
  // Dots
  ROUTE_COORDS.forEach(([lat,lng,name])=>{
    const pos=latLngToVec(lat,lng,1.02);
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.012,8,8),new THREE.MeshBasicMaterial({color:0x2ABFAA}));
    dot.position.copy(pos); scene.add(dot);
  });
  scene.rotation.y=1.5; scene.rotation.x=0.2;
  let isDragging=false,prevMouse={x:0,y:0},autoRotate=true;
  canvas.addEventListener('mousedown',e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY};autoRotate=false;});
  window.addEventListener('mouseup',()=>isDragging=false);
  window.addEventListener('mousemove',e=>{
    if(!isDragging) return;
    scene.rotation.y+=(e.clientX-prevMouse.x)*0.005;
    scene.rotation.x+=(e.clientY-prevMouse.y)*0.005;
    prevMouse={x:e.clientX,y:e.clientY};
  });
  canvas.addEventListener('wheel',e=>{ camera.position.z=Math.max(1.4,Math.min(5.5,camera.position.z+e.deltaY*0.002)); });
  canvas.addEventListener('click',()=>{ autoRotate=!autoRotate; document.getElementById('globe-hint').textContent=autoRotate?'Click to pause · Scroll to zoom · Drag to rotate':'▶ Click to resume · Scroll to zoom · Drag to rotate'; });
  (function animate(){globeAnimFrame=requestAnimationFrame(animate);if(autoRotate&&!isDragging)scene.rotation.y+=0.0012;renderer.render(scene,camera);})();
}

//  LEAFLET MAP

let leafletMap=null, currentTileLayer=null;
function initLeafletMap(){
  if(leafletMap){leafletMap.invalidateSize();return;}
  leafletMap=L.map('leaflet-map').setView([10,105],3);
  currentTileLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(leafletMap);
  ROUTE_COORDS.forEach(([lat,lng,name])=>{
    L.circleMarker([lat,lng],{radius:7,fillColor:'#2ABFAA',color:'#E8654A',weight:2,fillOpacity:0.9})
     .bindPopup(`<b>${name}</b>`).addTo(leafletMap);
  });
  // Route polyline
  L.polyline(ROUTE_COORDS.map(([lat,lng])=>[lat,lng]),{color:'#E8654A',weight:2,opacity:0.6,dashArray:'6 4'}).addTo(leafletMap);
}
function setMapMode(mode){
  if(!leafletMap) return;
  if(currentTileLayer) leafletMap.removeLayer(currentTileLayer);
  if(mode==='satellite'){
    currentTileLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:18}).addTo(leafletMap);
  } else {
    currentTileLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(leafletMap);
  }
  document.querySelectorAll('.gmode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('gbtn-'+mode).classList.add('active');
}
